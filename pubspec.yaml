name: shongjog
description: "Offline Bangla voice-first emergency companion powered by on-device Gemma 4."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8

  # On-device LLM
  # 1.x is modular: the core registers no engine, so the .litertlm engine
  # package must be added AND registered via FlutterGemma.initialize().
  # Gemma 4's only Android artifact is .litertlm — the repo's lone .task is a
  # raw-TFL3 web/WASM build that MediaPipe's Android runtime cannot open.
  flutter_gemma: ^1.3.0
  flutter_gemma_litertlm: ^1.1.0

  # Voice out (in via Vosk is deferred — see Phase 4.1 plan).
  # flutter_tts: Bangla text-to-speech (bn-BD / bn-IN fallback).
  # speech_to_text: online-friendly STT (re-evaluated in Phase 4.1).
  # vosk_flutter_service: deferred — the 0.1.2 plugin ships compileSdk 33
  #   in pub-cache, which AGP 9.x hard-rejects (its transitive androidx
  #   deps need compileSdk ≥ 34). Skeleton compiles without it; revisit in
  #   Phase 4.1 (fork the plugin, edit pub-cache, or pick a different STT).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Location & map
  geolocator: ^13.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  http: ^1.2.0

  # Actions (tel: on the cellular voice channel, sms: via method channel)
  url_launcher: ^6.3.0

  # Model management & state
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  background_downloader: ^9.0.0

  # Utilities
  collection: ^1.18.0
  vector_math: ^2.1.4
  audioplayers: ^6.8.1
  video_player: ^2.9.0

  # Cloud AI & Mesh Networking (Phase 4.6 & 4.7)
  google_generative_ai: ^0.4.6
  connectivity_plus: ^6.1.1
  nearby_connections: ^4.3.0
  flutter_p2p_connection: ^3.0.3
  record: ^6.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^13.2.0

  # Secure storage (API keys, sensitive preferences)
  flutter_secure_storage: ^10.3.1

  # Profile photo picker
  image_picker: ^1.0.0
  # Direct dependency purely to reach `useAndroidPhotoPicker`, which is not
  # exposed through the federated `image_picker` facade. See main.dart.
  image_picker_android: ^0.8.12
  # Referenced directly for the `ImagePickerPlatform.instance` type check in
  # main.dart, so it is declared rather than relied on transitively.
  image_picker_platform_interface: ^2.10.0
  flutter_displaymode: ^0.7.0
  gal: ^2.3.2

  # Firestore backend for the admin panel (campaigns, broadcasts, safety
  # reports) — cross-device sync so an admin on one phone can see data
  # submitted on another. Anonymous auth only; no push/remote-config/
  # analytics/crashlytics — see docs/firebase-backend-plan.md for the
  # full (unimplemented) superset this is scoped down from.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/kb/
    - assets/shelter/
    - assets/sound/chime.wav
    - assets/sound/knock.wav
    - assets/emergency/
    - assets/icon_foreground.png
  fonts:
    - family: AnekBangla
      fonts:
        - asset: assets/fonts/AnekBangla.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# Launcher icon generation. Run `dart run flutter_launcher_icons` after
# changing any of the source images below.
#
# minSdk is 26, so EVERY device this ships to uses an adaptive-icon launcher.
# Without the adaptive_icon_* pair the launcher falls back to legacy treatment
# — it shrinks the square PNG onto a white plate, which is why the icon used to
# render as a small blue blob inside a white circle.
#
# `Shongjog_logo.png` is no longer used directly: it is RGB with no alpha, so
# the area outside the squircle was baked pure black and shipped as black
# corners. `icon_legacy.png` is the same artwork with those corners made
# transparent; `icon_foreground.png` is the S lifted onto transparency and
# sized to 78% of the canvas so it bleeds past the launcher mask, exactly as
# it used to bleed past the squircle edge.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon_legacy.png"
  adaptive_icon_background: "#006CD5"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  web:
    generate: true

# Native splash screen generation. Run `dart run flutter_native_splash:create`
# after changing any of the values below.
#
# Cold-boot is always dark (design.md §7.8): the native splash uses #0F172A
# (slate-900) on ALL platforms regardless of system theme, matching the
# Flutter SplashScreen background so there is no white flash or hard cut.
flutter_native_splash:
  color: "#0F172A"
  color_dark: "#0F172A"
  image: assets/icon_foreground.png
  image_dark: assets/icon_foreground.png
  android_12:
    image: assets/icon_foreground.png
    image_dark: assets/icon_foreground.png
    color: "#0F172A"
    color_dark: "#0F172A"
    icon_background_color: "#0F172A"
    icon_background_color_dark: "#0F172A"
  android: true
  ios: true
  web: true