name: shongjog
description: "Offline Bangla voice-first emergency companion powered by on-device Gemma 4."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # On-device LLM
  flutter_gemma: ^0.5.0

  # Voice out (in via Vosk is deferred — see Phase 4.1 plan).
  # flutter_tts: Bangla text-to-speech (bn-BD / bn-IN fallback).
  # speech_to_text: online-friendly STT (re-evaluated in Phase 4.1).
  # vosk_flutter_service: deferred — the 0.1.2 plugin ships compileSdk 33
  #   in pub-cache, which AGP 9.x hard-rejects (its transitive androidx
  #   deps need compileSdk ≥ 34). Skeleton compiles without it; revisit in
  #   Phase 4.1 (fork the plugin, edit pub-cache, or pick a different STT).
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Location & map
  geolocator: ^13.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  http: ^1.2.0

  # Actions (tel:/sms: on the cellular voice channel)
  url_launcher: ^6.3.0

  # Model management & state
  background_downloader: ^9.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0

  # Utilities
  collection: ^1.18.0
  vector_math: ^2.1.4
  audioplayers: ^6.8.1

  # Cloud AI & Mesh Networking (Phase 4.6 & 4.7)
  google_generative_ai: ^0.4.6
  connectivity_plus: ^6.1.1
  nearby_connections: ^4.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/kb/
    - assets/shelter/
    - assets/vosk/
    - assets/sound/chime.wav
    - assets/sound/knock.wav
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600